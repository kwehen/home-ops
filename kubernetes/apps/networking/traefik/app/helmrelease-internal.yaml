---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: flux-system
spec:
  chart:
    spec:
      chart: traefik
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      version: 42.2.*
  install:
    crds: Create
    remediation:
      retries: 3
    # createNamespace: true
  interval: 1m0s
  releaseName: traefik-internal
  targetNamespace: networking
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    additionalArguments:
    - --serversTransport.insecureSkipVerify=true
    - --log.level=INFO
    deployment:
      additionalContainers: []
      annotations: {}
      enabled: true
      initContainers: []
      podAnnotations: {}
      replicas: 2
    global:
      sendAnonymousUsage: false
      checkNewVersion: false
    env:
      - name: HOST_IP
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
    tracing:
      serviceName: traefik-internal
      resourceAttributes:
        deployment.environment: prod
      otlp:
        enabled: true
        http:
          enabled: true
          endpoint: "http://datadog-agent.monitoring.svc.cluster.local:4318/v1/traces"
    ingressRoute:
      dashboard:
        enabled: true
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http:
          tls:
            enabled: true
      metrics:
        port: 8082
        expose:
          default: true
        exposedPort: 8082
    providers:
      kubernetesCRD:
        allowExternalNameServices: true
        allowCrossNamespace: true
        enabled: true
        ingressClass: traefik-internal
      kubernetesIngress:
        allowExternalNameServices: true
        enabled: true
        publishedService:
          enabled: true
    metrics:
      prometheus:
        enabled: true
        entryPoint: metrics
        service:
          enabled: true
        serviceMonitor:
          enabled: true
    # tlsStore:
    #   default:
    #     defaultCertificate:
    #       secretName: internal-default-tls
    rbac:
      enabled: true
    service:
      annotations: {}
      enabled: true
      externalIPs: []
      labels: {}
      loadBalancerSourceRanges: []
      spec:
        externalTrafficPolicy: Local
        loadBalancerIP: "${TRAEFIK_INTERNAL_IP}"
      type: LoadBalancer