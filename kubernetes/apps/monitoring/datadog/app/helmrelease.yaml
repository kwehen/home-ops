---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: datadog-agent
  namespace: flux-system
spec:
  chart:
    spec:
      chart: datadog
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: datadog
        namespace: flux-system
      version: 3.*
  install:
    crds: Create
    timeout: 7m
  interval: 1m0s
  timeout: 7m
  releaseName: datadog-agent
  targetNamespace: monitoring
  upgrade:
    crds: CreateReplace
    timeout: 7m
  values:
    datadog:
      kubelet:
        tlsVerify: false
      env:
        - name: DD_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      site: "datadoghq.com"
      clusterName: "k8s-home-talos"
      apiKeyExistingSecret: "datadog-secret"
      clusterChecks:
        enabled: true
      orchestratorExplorer:
        enabled: true
      otlp:
        receiver:
          protocols:
            grpc:
              enabled: true
            http:
              enabled: true
      tags:
        - "env:prod"
      apm:
        instrumentation:
          enabled: true
          targets:
            - name: "default-target"
              ddTraceVersions:
                java: "1"
                python: "4"
                js: "5"
              ddTraceConfigs:
                - name: "DD_PROFILING_ENABLED"
                  value: "auto"
                - name: "DD_TRACE_PROPAGATION_STYLE"
                  value: "datadog,tracecontext"
                - name: "DD_TRACE_128_BIT_TRACEID_GENERATION_ENABLED"
                  value: "true"
                - name: "DD_LOGS_INJECTION"
                  value: "true"
      logs:
        enabled: true
        containerCollectAll: true
      confd:
        unifi-syslog.yaml: |-
          logs:
            - type: udp
              port: 10514
              service: unifi-gateway
              source: unifi
    agents:
      # Reloader watches the DaemonSet metadata annotations (not the pod template).
      daemonsetAnnotations:
        reloader.stakater.com/auto: "true"
      containers:
        agent:
          ports:
            - name: syslog-udp
              containerPort: 10514
              protocol: UDP
    clusterAgent:
      # Reloader watches the Deployment metadata annotations (not the pod template).
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
    providers:
      talos:
        enabled: true