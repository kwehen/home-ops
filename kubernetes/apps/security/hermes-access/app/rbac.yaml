# Read-only identity for the Hermes agent.
# The built-in "view" ClusterRole excludes Secrets; Flux CRDs are covered by
# Flux's flux-view role, which is aggregated into "view".
# The kubeconfig is built by hand from the hermes-token Secret and is never committed.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
  namespace: security
---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-token
  namespace: security
  annotations:
    kubernetes.io/service-account.name: hermes
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-cluster-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-cluster-read
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: security
