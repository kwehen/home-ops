---
# yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
spec:
  interval: 30m
  chart:
    spec:
      chart: harbor
      version: 1.19.1
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  postRenderers:
    # harbor-helm 1.19.1 exposes no Deployment-level annotation values key, so patch
    # the core Deployment directly to let Reloader watch its secrets (admin password).
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: harbor-core
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: harbor-core
                annotations:
                  reloader.stakater.com/auto: "true"
  values:
    expose:
      type: ingress
      tls:
        enabled: true
        certSource: secret
        secret:
          secretName: registry-tls
      ingress:
        hosts:
          core: registry.home.${INTERNAL_DOMAIN}
        className: traefik-internal
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          cert-manager.io/cluster-issuer: letsencrypt-production-internal
          traefik.ingress.kubernetes.io/router.middlewares: |
            networking-ipwhitelist@kubernetescrd,
            networking-request-limit@kubernetescrd
    externalURL: https://registry.home.${INTERNAL_DOMAIN}
    persistence:
      enabled: true
      persistentVolumeClaim:
        registry:
          storageClass: longhorn
          size: 30Gi
    existingSecretAdminPassword: harbor-admin-password